name: CI

# Lightweight checks that run WITHOUT Mininet/OVS/GPU. They guard the two things
# most likely to silently break this repo: the lazy-import convention (no top-level
# mininet/os-ken import in the root modules) and the Dockerfile COPY list.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pure-Python deps only. Mininet/os-ken are intentionally NOT installed — so if
      # someone moves a `import mininet`/`os_ken` to module top level, the import step
      # below fails, which is exactly the regression we want to catch.
      - name: Install lightweight deps
        run: pip install --quiet pandas numpy networkx

      # Root modules only (the same set the Dockerfile COPYs); legacy/ is not lazy and
      # is not part of the active code path.
      - name: Syntax check (py_compile) root modules
        run: python -m py_compile *.py

      - name: Import light_simulation (lazy-import convention, no Mininet present)
        run: python -c "import light_simulation; print('import light_simulation OK')"

      # For every topology x each of the 11 routing modes, compute_paths() must return a
      # non-empty result that covers every distinct-host ordered pair, and every returned
      # path (including ECMP multipath sub-lists) must start at the source host's switch
      # and end at the destination host's switch.
      #
      # NOTE: we deliberately do NOT assert loop-free paths. routing.py intentionally
      # injects stochastic imperfections (RIP counting-to-infinity `path + [path[-1]]`,
      # OSPF SPF-staleness re-routing) that can repeat a node — those are realistic
      # dataset artifacts, not bugs. We seed `random` only for a reproducible run; the
      # asserted invariants (coverage + correct endpoints) hold regardless of the draws.
      - name: compute_paths sanity sweep (all topologies x 11 modes)
        run: |
          python - <<'PY'
          import itertools, random, sys
          random.seed(0)
          from routing import compute_paths
          from topologies import TOPOLOGIES

          MODES = ["l2_learn", "rip", "ospf", "isis", "eigrp", "bgp",
                   "ecmp", "spf", "policy", "static", "hybrid"]
          errors = []

          def subpaths(val):
              # A value is either a single path (list[str]) or ECMP multipath (list[list[str]]).
              if val and isinstance(val[0], list):
                  yield from val
              else:
                  yield val

          for tname, topo in TOPOLOGIES.items():
              hosts = topo["hosts"]
              names = list(hosts.keys())
              for mode in MODES:
                  paths = compute_paths(topo, mode)
                  if not paths:
                      errors.append(f"{tname}/{mode}: empty result")
                      continue
                  missing = [(s, d) for s, d in itertools.permutations(names, 2)
                             if (s, d) not in paths]
                  if missing:
                      errors.append(f"{tname}/{mode}: {len(missing)} missing pairs e.g. {missing[:3]}")
                  for (s, d), val in paths.items():
                      ssw, dsw = hosts[s]["switch"], hosts[d]["switch"]
                      for p in subpaths(val):
                          if not p:
                              errors.append(f"{tname}/{mode}: empty path {s}->{d}")
                              break
                          if p[0] != ssw or p[-1] != dsw:
                              errors.append(f"{tname}/{mode}: bad endpoints {s}->{d}: {p} "
                                            f"(want {ssw}..{dsw})")
                              break

          if errors:
              print("SANITY SWEEP FAILED:")
              for e in errors[:30]:
                  print("  ", e)
              sys.exit(1)
          print("compute_paths sweep OK: 4 topologies x 11 modes, "
                "non-empty, full pair coverage, correct endpoints")
          PY

  netlab-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NetLab backend deps (+ ns-3 engine wheel)
        run: pip install --quiet -r lab/requirements.txt httpx ns3 pandas
      - name: Syntax check lab/
        run: python -m py_compile lab/*.py lab/drivers/*.py lab/engines/*.py lab/templates/sdn/*.py lab/tests/*.py
      - name: OSPF startup policy regression
        run: python -m unittest lab.tests.test_ospf_policy lab.tests.smoke_ospf_policy -v
      # Real driver must import without Mininet present (all mininet imports are lazy).
      - name: Import real driver without Mininet
        run: python -c "import lab.drivers.mininet_driver"
      - name: Calibration collector regression (no root required)
        run: python -m unittest lab.tests.test_calibration_collector -v
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # React UI tiplar tekshiruvi va yig'ish. Yig'ilgan lab/web-react repo'da saqlanadi
      # (foydalanuvchiga Node.js shart emas); bu yerda manba bilan mosligi tekshiriladi.
      - name: Build React UI (typecheck + vite build)
        working-directory: lab/ui
        run: npm ci --no-audit --no-fund && npm run build
      - name: Built UI must be committed (lab/web-react up to date)
        run: |
          git diff --stat --exit-code -- lab/web-react || (echo "lab/web-react eskirgan: cd lab/ui && npm run build" && exit 1)
      - name: NetLab smoke test (demo driver, analytic + ns-3 scenario runs, token)
        run: python lab/tests/smoke_demo.py
      - name: NetLab smoke tests (BGP, STP, Firewall)
        run: |
          python -m lab.tests.smoke_bgp
          python -m lab.tests.smoke_stp
          python -m lab.tests.smoke_fw
          python -m lab.tests.smoke_mcast
          python -m lab.tests.smoke_vrrp
          python -m lab.tests.smoke_lag
          python -m lab.tests.smoke_survivability
          python -m lab.tests.smoke_failures
          python -m lab.tests.smoke_perf
          python -m lab.tests.smoke_report
          python -m lab.tests.smoke_survivability_n2
      - name: Scenario and application admission regression
        run: python -m unittest lab.tests.test_scenario_validation lab.tests.test_application_validation lab.tests.test_failure_validation lab.tests.smoke_scenario_inputs -v
      - name: IPv6 model and ns-3 packet regression
        run: python -m unittest lab.tests.smoke_ipv6 lab.tests.smoke_isis lab.tests.smoke_ospf lab.tests.smoke_experiments lab.tests.smoke_experiment_comparison lab.tests.smoke_campaigns lab.tests.smoke_studies -v
      - name: Adaptive CPU and RAM dispatch regression
        run: python -m unittest lab.tests.test_adaptive_workers -v
      - name: ns-3 subprocess lifecycle regression (no ns-3 installation required)
        run: python -m unittest lab.tests.test_ns3_process lab.tests.test_ns3_process_backlog lab.tests.test_ns3_lifecycle_integration -v
      - name: Runtime safety and dataset labeling regression
        run: python -m unittest lab.tests.test_runtime_safety ml.test_labeling lab.tests.test_calibration lab.tests.test_ospf_convergence lab.tests.test_traffic lab.tests.test_run_queue lab.tests.test_experiments lab.tests.test_result_index lab.tests.test_analysis_windows lab.tests.test_experiment_comparison lab.tests.test_campaigns lab.tests.test_campaign_analysis -v

      - name: Analytical TCP allocation and transfer conservation regression
        run: python -m unittest lab.tests.test_tcp_fluid lab.tests.test_analytic_tcp lab.tests.test_analytic_tcp_benchmark -v
      - name: Real emulation worker lifecycle regression (no root required)
        run: python -m unittest lab.tests.test_emulation_workers -v
      - name: Project validation and live update regression
        run: python -m unittest lab.tests.test_project_validation lab.tests.test_project_values lab.tests.test_project_preparation lab.tests.test_live_project_guards lab.tests.smoke_project_inputs -v
      - name: Topology planning and traffic import regression
        run: python -m unittest lab.tests.test_topogen lab.tests.test_traffic_validation lab.tests.test_generation_api lab.tests.smoke_generated_imports -v
      - name: Real network lock regression (no root or Mininet required)
        run: python -m unittest lab.tests.test_real_lock -v
      - name: Scale benchmark evidence regression (no root or Mininet required)
        run: python -m unittest lab.tests.test_scale_benchmark -v
      - name: Analytical sampling and fractional metric regression
        run: python -m unittest lab.tests.test_analytic_sampling lab.tests.test_sampling_compatibility lab.tests.test_fractional_postprocess -v
      - name: Calibration evidence and CLI regression
        run: python -m unittest lab.tests.test_calibration_evidence -v
      - name: Durable parameter study admission and report regression
        run: python -m unittest lab.tests.test_study_preparation lab.tests.test_study_queue lab.tests.test_study_reports lab.tests.test_study_notifications lab.tests.test_dispatch_groups -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build only (no run — Mininet needs --privileged and a real network namespace).
      # This catches a missing-COPY regression: if a root module the app imports is left
      # out of the Dockerfile, the image still builds, so we additionally smoke-check the
      # image below by importing every copied module inside the container.
      - name: Docker build (build only)
        run: docker build -f docker/Dockerfile -t internet-sim:ci .

      - name: Verify all root modules were copied into the image
        run: |
          docker run --rm --entrypoint python3 internet-sim:ci -c \
            "import config, topologies, routing, netutil; print('modules present in image')"
