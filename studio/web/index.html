<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Network Studio</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/screens/dashboard.css">
  <link rel="stylesheet" href="css/screens/builder.css">
  <link rel="stylesheet" href="css/screens/analytics.css">
  <link rel="stylesheet" href="css/screens/control.css">
  <link rel="stylesheet" href="css/screens/settings.css">
</head>
<body>
  <!-- Fon effekti (liquid/aurora bloblar) — theme.css bezaydi -->
  <div class="aurora" aria-hidden="true">
    <span class="aurora-blob b1"></span>
    <span class="aurora-blob b2"></span>
    <span class="aurora-blob b3"></span>
  </div>

  <div id="app">
    <!-- Chap navigatsiya paneli — app.js ro'yxatga olingan ekranlardan quradi -->
    <aside id="sidebar" class="glass">
      <div class="brand">
        <div class="brand-mark" id="brand-mark"></div>
        <div class="brand-text">
          <div class="brand-title">Network<span>Studio</span></div>
          <div class="brand-sub">SDN simulyatsiya boshqaruvi</div>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <div id="conn-status" class="conn-status" title="Server ulanishi">
          <span class="dot"></span><span class="conn-label">Ulanmagan</span>
        </div>
      </div>
    </aside>

    <!-- Asosiy soha -->
    <div id="main">
      <header id="topbar" class="glass">
        <div class="topbar-left">
          <h1 id="screen-title">Boshqaruv paneli</h1>
          <p id="screen-subtitle" class="muted"></p>
        </div>
        <div class="topbar-right">
          <button id="theme-toggle" class="icon-btn" title="Kun/tun mavzu" aria-label="Mavzu">
            <span class="theme-ico"></span>
          </button>
        </div>
      </header>

      <main id="screen-root">
        <!-- Faol ekran shu yerga render qilinadi -->
      </main>
    </div>
  </div>

  <!-- Toast/xabar konteyneri -->
  <div id="toasts" aria-live="polite"></div>

  <!-- Ko'prik: window.pywebview.api ustidan yupqa async o'rov -->
  <script src="js/bridge.js"></script>
  <!-- Yadro: router, mavzu, ekran registri -->
  <script src="js/app.js"></script>
  <!-- Grafik yordamchisi (canvas) -->
  <script src="js/charts.js"></script>
  <!-- Ekranlar: har biri Studio.screen(...) orqali o'zini ro'yxatga oladi -->
  <script src="js/screens/dashboard.js"></script>
  <script src="js/screens/builder.js"></script>
  <script src="js/screens/analytics.js"></script>
  <script src="js/screens/control.js"></script>
  <script src="js/screens/settings.js"></script>
  <!-- Boshlash (barcha ekranlar ro'yxatga olingandan keyin) -->
  <script>window.addEventListener('DOMContentLoaded', () => Studio.boot());</script>
</body>
</html>
